<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ultimate Games Night</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="description" content="A game-show website for hosting games night on the big screen.">
  <meta name="theme-color" content="#0c0809">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="stage" aria-live="polite"></main>

  <nav class="steps" id="steps" aria-label="Show progress"></nav>

  <nav class="bar" id="bar" aria-label="Show controls">
    <button class="bar__btn" id="btn-host" type="button" title="Host controls in a new window (H)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="12" height="9" rx="1.5"/><path d="M7 17h4M9 13v4"/><rect x="17" y="8" width="5" height="11" rx="1.2"/></svg>
      <span class="sr">Host controls</span>
    </button>
    <button class="bar__btn" id="btn-sound" type="button" aria-pressed="true" title="Sound (M)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-on" d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="i-off" d="M4 9h4l5-4v14l-5-4H4zM16 9.5l5 5M21 9.5l-5 5"/></svg>
      <span class="sr">Sound</span>
    </button>
    <button class="bar__btn" id="btn-full" type="button" title="Full screen (F)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span class="sr">Full screen</span>
    </button>
    <button class="bar__btn" id="btn-settings" type="button" title="Settings (S)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span class="sr">Settings</span>
    </button>
  </nav>

  <dialog class="settings" id="settings" aria-labelledby="settings-title"></dialog>

  <script src="data/default-pack.js"></script>
  <script src="js/store.js"></script>
  <script src="js/lineup.js"></script>
  <script src="js/fx/liquid.js"></script>
  <script src="js/fx/hanging.js"></script>
  <script src="js/fx/boxgrid.js"></script>
  <script src="js/fx/ascii.js"></script>
  <script src="js/fx/spiral.js"></script>
  <script src="js/fx/confetti.js"></script>
  <script src="js/music.js"></script>
  <script src="js/mini.js"></script>
  <script src="js/category.js"></script>
  <script src="js/tiebreak.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/scores.js"></script>
  <script src="js/ui/dock.js"></script>
  <script src="js/screens/title.js"></script>
  <script src="js/screens/teams.js"></script>
  <script src="js/screens/setup.js"></script>
  <script src="js/screens/rules.js"></script>
  <script src="js/screens/order.js"></script>
  <script src="js/screens/mini-view.js"></script>
  <script src="js/screens/category-view.js"></script>
  <script src="js/screens/finale.js"></script>
  <script src="js/screens/play.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/host.js"></script>
  <script src="js/packs.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/remote.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
